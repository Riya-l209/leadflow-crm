version: "3.9"

services:
  server:
    build:
      context: ./server
    ports:
      - "4000:4000"

    volumes:
      - ./server:/app
      - /app/node_modules

    working_dir: /app

    command: npm run dev

  client:
    build:
      context: ./client
    ports:
      - "5173:5173"

    volumes:
      - ./client:/app
      - /app/node_modules

    working_dir: /app

    command: npm run dev -- --host

    depends_on:
      - server